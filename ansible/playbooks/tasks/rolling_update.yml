# Roll every replica of the env to deploy_tag, one at a time.
# Replicas: 1..env_cfg.replicas plus any extra ones the healer scaled up.
- name: List current API replicas
  community.docker.docker_host_info:
    containers: true
    verbose_output: true  # full entries: Labels, State, NetworkSettings
    containers_all: true
    containers_filters:
      label:
        - com.adpulse.env={{ env }}
        - com.adpulse.role=api
  register: api_containers

- name: Work out which replica indexes to roll
  ansible.builtin.set_fact:
    # Label keys contain dots, so read them with .get() (map(attribute=...)
    # would treat the dots as a nested path and always return the default).
    replica_indexes: >-
      {%- set out = range(1, env_cfg.replicas + 1) | list -%}
      {%- for c in api_containers.containers -%}{%- set _ = out.append((c.Labels or {}).get('com.adpulse.replica', '0') | int) -%}{%- endfor -%}
      {{ out | select('gt', 0) | unique | sort }}

- name: Roll replicas one at a time
  ansible.builtin.include_tasks: replica.yml
  vars:
    replica_name: "api-{{ env }}-{{ replica_index }}"
  loop: "{{ replica_indexes }}"
  loop_control:
    loop_var: replica_index
