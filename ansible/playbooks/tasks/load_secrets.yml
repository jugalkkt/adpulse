# Read this env's secrets from .env (gitignored, mode 600). Never logged.
- name: Check that the env is known
  ansible.builtin.assert:
    that: env is defined and env in envs
    fail_msg: "Pass -e env=<{{ envs.keys() | join('|') }}>"
    quiet: true

- name: Load secrets from .env
  ansible.builtin.set_fact:
    db_app_password: "{{ lookup('ansible.builtin.ini', secret_prefix ~ '_DB_APP_PASSWORD', file=env_file, type='properties') }}"
    redis_password: "{{ lookup('ansible.builtin.ini', secret_prefix ~ '_REDIS_PASSWORD', file=env_file, type='properties') }}"
    chaos_token: "{{ lookup('ansible.builtin.ini', 'CHAOS_TOKEN', file=env_file, type='properties') }}"
  no_log: true
