- name: Ensure deploy/state exists
  ansible.builtin.file:
    path: "{{ state_dir }}"
    state: directory
    mode: "0750"

- name: Read deploy state for {{ env }}
  ansible.builtin.slurp:
    src: "{{ state_dir }}/{{ env }}.json"
  register: state_raw
  failed_when: false

- name: Parse deploy state
  ansible.builtin.set_fact:
    deploy_state: "{{ (state_raw.content | b64decode | from_json) if state_raw.content is defined else {} }}"
