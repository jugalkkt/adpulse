# Used by the healer container (ANSIBLE_CONFIG). Playbooks act on the Docker
# host through DOCKER_HOST (the docker-socket-proxy), from localhost.
[defaults]
inventory = localhost,
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
nocows = True
# The healer runs as the host uid; in the image that uid may map to a user
# whose home is on the read-only rootfs (uid 1000 = "ubuntu"). Keep all of
# Ansible's temp files on the /tmp tmpfs.
remote_tmp = /tmp/.ansible/remote
local_tmp = /tmp/.ansible/tmp
