# Run migrations only: make migrate ENV=staging TAG=<sha>
- name: Migrate AdPulse database
  hosts: all
  gather_facts: false
  tasks:
    - name: Load secrets
      ansible.builtin.include_tasks: tasks/load_secrets.yml

    - name: Migrate
      ansible.builtin.include_tasks: tasks/migrate.yml
      vars:
        deploy_tag: "{{ image_tag }}"
