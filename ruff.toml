# Ruff settings for Python outside app/ (scripts/, monitoring/, healer/, chaos/, tools/).
# app/ has its own pyproject.toml with the same style.
line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S311"]

[lint.per-file-ignores]
"scripts/check_dashboards.py" = ["S310"]  # urlopen on a fixed local Prometheus URL
"**/tests/**" = ["S101", "S105", "S106"]
"tools/rca.py" = ["E501", "S310"]  # long Markdown f-strings; urlopen on fixed local Prometheus URL
"chaos/chaos.py" = ["S310", "S603", "S607", "S108"]  # fixed local URLs; docker CLI argv; /tmp is the stress container's own tmpfs
